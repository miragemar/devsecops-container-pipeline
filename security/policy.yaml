# Політика безпеки контейнерних образів

# Максимальна кількість вразливостей кожного рівня,
# яку дозволено мати образу.
max_vulnerabilities:
  CRITICAL: 0
  HIGH: 0
  MEDIUM: 5
  LOW: 20
  UNKNOWN: 0

# Чи блокувати образ, якщо сканер не зміг
# визначити рівень критичності вразливості.
fail_on_unknown: true
