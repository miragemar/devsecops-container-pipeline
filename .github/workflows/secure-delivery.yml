
name: Secure Container Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  container-security:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t secure-container-app:${{ github.sha }} .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install policy evaluator dependency
        run: python -m pip install -r requirements.txt

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: latest

      - name: Scan image and create JSON report
        run: ./security/scan-image.sh secure-container-app:${{ github.sha }}

      - name: Generate SBOM
        run: ./scripts/generate-sbom.sh secure-container-app:${{ github.sha }}

      - name: Evaluate security policy
        run: python security/evaluate-policy.py --report reports/trivy-report.json --policy security/policy.yaml

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            reports/trivy-report.json
            reports/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 14
